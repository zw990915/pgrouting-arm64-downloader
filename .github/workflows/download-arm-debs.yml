name: Download pgRouting ARM64 DEBs

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: 'PostgreSQL Version (12 recommended)'
        required: true
        default: '12'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup PGDG repository
        run: |
          # Use the official PGDG script which handles everything
          curl https://www.postgresql.org/media/keys/ACCC4ED8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-archive.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
      
      - name: Create package directory
        run: mkdir -p pgrouting-arm64-offline
      
      - name: Download packages
        run: |
          cd pgrouting-arm64-offline
          
          VERSION="${{ github.event.inputs.postgresql_version || '12' }}"
          
          echo "Downloading PostgreSQL $VERSION packages..."
          
          # Try to download all packages in one command
          sudo apt-get download \
            postgresql-$VERSION \
            postgresql-server-dev-$VERSION \
            postgresql-client-$VERSION \
            postgresql-$VERSION-common \
            postgresql-$VERSION-postgis-3 \
            postgresql-$VERSION-pgrouting \
            postgis \
            libgeos-c1v5 \
            libgdal25 || {
              echo "First attempt failed, trying with fallback names..."
              sudo apt-get download \
                postgresql-12 \
                postgresql-server-dev-12 \
                postgresql-client-12 \
                postgresql-12-common \
                postgis-3 \
                postgresql-12-pgrouting \
                postgis-bin \
                libgeos-c1v5 \
                libgdal25
            }
      
      - name: Create tarball
        run: |
          tar -czvf pgrouting-${{ github.event.inputs.postgresql_version || '12' }}-arm64.tar.gz pgrouting-arm64-offline/
          ls -lh pgrouting-${{ github.event.inputs.postgresql_version || '12' }}-arm64.tar.gz
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgrouting-${{ github.event.inputs.postgresql_version || '12' }}-arm64-offline
          path: pgrouting-${{ github.event.inputs.postgresql_version || '12' }}-arm64.tar.gz
          retention-days: 7
