name: Download pgRouting ARM64 DEBs

on:
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: 'PostgreSQL Version (e.g., 12, 13, 14)'
        required: true
        default: '12'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Update apt and setup PGDG repository
        run: |
          sudo apt-get update
          
          # Add PostgreSQL GPG key using modern method
          wget -qO- https://www.postgresql.org/media/keys/ACCC4ED8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          
          # Add PGDG repository with signed-by option
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          
          # Update package lists
          sudo apt-get update -y
          echo "PGDG repository configured successfully!"
      
      - name: Create package directory
        run: |
          mkdir -p pgrouting-arm64-offline
          ls -la
      
      - name: Download all required packages
        run: |
          cd pgrouting-arm64-offline
          
          # Get version from input or use default
          PG_VERSION="${{ github.event.inputs.postgresql_version || '12' }}"
          
          echo "Downloading PostgreSQL $PG_VERSION + extensions on Ubuntu..."
          
          sudo apt-get download \
            postgresql-$PG_VERSION \
            postgresql-server-dev-$PG_VERSION \
            postgresql-client-$PG_VERSION \
            postgresql-$PG_VERSION-common \
            postgresql-$PG_VERSION-postgis-3 \
            postgresql-$PG_VERSION-postgis-scripts \
            postgresql-$PG_VERSION-pgrouting \
            postgis \
            postgis-bin \
            libpostgis-jsts-${PG_VERSION} \
            libgeos-c1v5 \
            libproj19 \
            libsfcgal1 \
            libgdal25 \
            || sudo apt-get download \
            postgresql-12 \
            postgresql-server-dev-12 \
            postgresql-client-12 \
            postgresql-12-common \
            postgresql-12-postgis-3 \
            postgresql-12-postgis-scripts \
            postgresql-12-pgrouting \
            postgis \
            postgis-bin \
            libpostgis-jsts-3 \
            libgeos-c1v5 \
            libproj19 \
            libsfcgal1 \
            libgdal25
      
      - name: List downloaded packages
        run: |
          ls -lh pgrouting-arm64-offline/*.deb
          echo "Total packages: $(find pgrouting-arm64-offline -name '*.deb' | wc -l)"
      
      - name: Create compressed archive
        run: |
          tar -czvf pgrouting-arm64.tar.gz pgrouting-arm64-offline/
          ls -lh pgrouting-arm64.tar.gz
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgrouting-arm64-offline-packages
          path: pgrouting-arm64.tar.gz
          retention-days: 7
          compression-level: 6
